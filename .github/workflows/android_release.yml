name: Android Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest

    outputs:
      version_changed: ${{ steps.version.outputs.version_changed }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      package_name: ${{ steps.version.outputs.package_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check versionCode
        id: version
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/androidApp/build.gradle.kts"

          if [[ ! -f "$FILE" ]]; then
            echo "::error::Could not find $FILE"
            exit 1
          fi

          CURRENT_VERSION_CODE="$(
            sed -nE \
              's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' \
              "$FILE" \
              | head -n 1
          )"

          CURRENT_VERSION_NAME="$(
            sed -nE \
              's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              "$FILE" \
              | head -n 1
          )"

          CURRENT_PACKAGE_NAME="$(
            sed -nE \
              's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              "$FILE" \
              | head -n 1
          )"

          if [[ -z "$CURRENT_VERSION_CODE" ]]; then
            echo "::error::Could not find versionCode in $FILE"
            exit 1
          fi

          if [[ -z "$CURRENT_VERSION_NAME" ]]; then
            echo "::error::Could not find versionName in $FILE"
            exit 1
          fi

          if [[ -z "$CURRENT_PACKAGE_NAME" ]]; then
            echo "::error::Could not find applicationId in $FILE"
            exit 1
          fi

          BEFORE="${{ github.event.before }}"

          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "No previous commit exists."
            echo "Treating this as a version change."

            VERSION_CHANGED="true"
            PREVIOUS_VERSION_CODE=""
          else
            if git cat-file -e "${BEFORE}:${FILE}" 2>/dev/null; then
              PREVIOUS_VERSION_CODE="$(
                git show "${BEFORE}:${FILE}" \
                  | sed -nE \
                    's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' \
                  | head -n 1
              )
            else
              echo "File did not exist in the previous commit."
              PREVIOUS_VERSION_CODE=""
            fi

            if [[ "$PREVIOUS_VERSION_CODE" != "$CURRENT_VERSION_CODE" ]]; then
              VERSION_CHANGED="true"
            else
              VERSION_CHANGED="false"
            fi
          fi

          echo "Previous versionCode: ${PREVIOUS_VERSION_CODE:-<none>}"
          echo "Current versionCode:  $CURRENT_VERSION_CODE"
          echo "Current versionName:  $CURRENT_VERSION_NAME"
          echo "Application ID:       $CURRENT_PACKAGE_NAME"
          echo "Version changed:      $VERSION_CHANGED"

          echo "version_changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"
          echo "version_name=$CURRENT_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CURRENT_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "package_name=$CURRENT_PACKAGE_NAME" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build and Release
    needs: check-version

    if: needs.check-version.outputs.version_changed == 'true'

    runs-on: ubuntu-latest

    env:
      VERSION_NAME: ${{ needs.check-version.outputs.version_name }}
      VERSION_CODE: ${{ needs.check-version.outputs.version_code }}
      PACKAGE_NAME: ${{ needs.check-version.outputs.package_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify release notes
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "releaseNotes.md" ]]; then
            echo "::error::releaseNotes.md does not exist."
            exit 1
          fi

          if [[ ! -s "releaseNotes.md" ]]; then
            echo "::error::releaseNotes.md is empty."
            exit 1
          fi

          echo "Release notes:"
          echo "----------------------------------------"
          cat releaseNotes.md
          echo "----------------------------------------"

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

          if [[ ! -s "$RUNNER_TEMP/release.keystore" ]]; then
            echo "::error::The decoded keystore is empty."
            exit 1
          fi

          echo "Signing keystore decoded successfully."

      - name: Build signed APK and AAB
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew \
            :app:androidApp:assembleRelease \
            :app:androidApp:bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      - name: Find APK and AAB
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/androidApp/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          AAB="$(find app/androidApp/build/outputs/bundle/release \
            -type f \
            -name "*.aab" \
            | head -n 1)"

          if [[ -z "$APK" ]]; then
            echo "::error::Could not find release APK."
            exit 1
          fi

          if [[ -z "$AAB" ]]; then
            echo "::error::Could not find release AAB."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "AAB found:"
          echo "$AAB"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        id: renamed-apk
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="${{ steps.artifacts.outputs.apk }}"
          DESTINATION="The Baker's Archive - ${VERSION_NAME}.apk"

          cp "$SOURCE" "$DESTINATION"

          echo "apk=$DESTINATION" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner \
            verify \
            --verbose \
            "${{ steps.renamed-apk.outputs.apk }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: The Baker's Archive - ${{ env.VERSION_NAME }}
          body_path: releaseNotes.md
          files: |
            ${{ steps.renamed-apk.outputs.apk }}
          draft: false
          prerelease: false
          generate_release_notes: false

      - name: Upload AAB to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ steps.artifacts.outputs.aab }}
          track: production
          releaseName: The Baker's Archive - ${{ env.VERSION_NAME }}
          status: draft

      - name: Clean signing keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"