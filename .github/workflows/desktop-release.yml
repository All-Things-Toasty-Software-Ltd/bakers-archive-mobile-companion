name: Desktop Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest

    outputs:
      version_changed: ${{ steps.version.outputs.version_changed }}
      version_name: ${{ steps.version.outputs.version_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version.set in build.gradle.kts
        id: version
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/desktopApp/build.gradle.kts"

          if [[ ! -f "$FILE" ]]; then
            echo "::error::Could not find $FILE"
            exit 1
          fi

          # Extract version string (e.g. version.set("0.3.4.0"))
          CURRENT_VERSION_NAME=$(grep -E '^[[:space:]]*version\.set\(' "$FILE" \
            | head -n 1 \
            | sed -E 's/.*version\.set\("([^"]+)".*/\1/')

          if [[ -z "$CURRENT_VERSION_NAME" ]]; then
            echo "::error::Could not find version.set in msix configuration within $FILE"
            exit 1
          fi

          BEFORE="${{ github.event.before }}"

          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            VERSION_CHANGED="true"
            PREVIOUS_VERSION_NAME=""
          else
            if git cat-file -e "$BEFORE:$FILE" 2>/dev/null; then
              PREVIOUS_VERSION_NAME=$(git show "$BEFORE:$FILE" \
                | grep -E '^[[:space:]]*version\.set\(' \
                | head -n 1 \
                | sed -E 's/.*version\.set\("([^"]+)".*/\1/')
            else
              PREVIOUS_VERSION_NAME=""
            fi

            if [[ "$PREVIOUS_VERSION_NAME" != "$CURRENT_VERSION_NAME" ]]; then
              VERSION_CHANGED="true"
            else
              VERSION_CHANGED="false"
            fi
          fi

          echo "========================================"
          echo "Desktop Version"
          echo "========================================"
          echo "Previous version: ${PREVIOUS_VERSION_NAME:-<none>}"
          echo "Current version:  $CURRENT_VERSION_NAME"
          echo "Version changed:  $VERSION_CHANGED"
          echo "========================================"

          # Strips the tailing '.0' if present so 0.3.4.0 matches Android's 0.3.4 tag
          TAG_VERSION=$(echo "$CURRENT_VERSION_NAME" | sed -E 's/\.0$//')

          echo "version_changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"
          echo "version_name=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build and Publish MSIX
    needs: check-version

    if: needs.check-version.outputs.version_changed == 'true'

    runs-on: windows-latest

    env:
      VERSION_NAME: ${{ needs.check-version.outputs.version_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode PFX Certificate
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
        run: |
          $pfxPath = "$env:RUNNER_TEMP\signingCertificate.pfx"
          $bytes = [System.Convert]::FromBase64String($env:MSIX_PFX_BASE64)
          [System.IO.File]::WriteAllBytes($pfxPath, $bytes)
          echo "MSIX_PFX_PATH=$pfxPath" >> $env:GITHUB_ENV

      - name: Build MSIX Package
        shell: pwsh
        env:
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          ./gradlew :app:bakers-archive:createMsix --stacktrace

      - name: Locate Generated MSIX
        id: msix_finder
        shell: pwsh
        run: |
          $msixFile = Get-ChildItem -Path "app/desktopApp/build" -Filter "*.msix" -Recurse | Select-Object -First 1
          if (-not $msixFile) {
              Write-Error "Could not find generated MSIX file."
              exit 1
          }
          Write-Host "Found MSIX: $($msixFile.FullName)"
          echo "msix_path=$($msixFile.FullName)" >> $env:GITHUB_ENV

      - name: Verify releaseNotes.md
        shell: pwsh
        run: |
          if (-not (Test-Path "releaseNotes.md")) {
              Write-Error "releaseNotes.md does not exist."
              exit 1
          }

      - name: Attach MSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: The Baker's Archive - ${{ env.VERSION_NAME }}
          body_path: releaseNotes.md
          files: ${{ env.msix_path }}
          draft: false
          prerelease: false

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Reconfigure store credentials
        shell: pwsh
        run: |
          $params = @{
              tenantId     = '${{ secrets.AZURE_AD_TENANT_ID }}'
              sellerId     = '${{ secrets.SELLER_ID }}'
              clientId     = '${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}'
              clientSecret = '${{ secrets.AZURE_AD_APPLICATION_SECRET }}'
          }
          msstore reconfigure @params

      - name: Publish App Package to Microsoft Store
        shell: pwsh
        run: |
          msstore publish "${{ env.msix_path }}" -id ${{ secrets.STORE_PRODUCT_ID }}

      - name: Clean Temporary Certificate
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP\signingCertificate.pfx") {
              Remove-Item "$env:RUNNER_TEMP\signingCertificate.pfx" -Force
          }