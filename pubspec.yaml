name: bakers_archive
description: "The Baker's Archive Mobile Companion by Toasty Software Ltd"
publish_to: 'none'

version: 1.0.0+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  msix: ^3.18.0

flutter:
  uses-material-design: true

msix_config:
  display_name: The Baker's Archive
  publisher_display_name: Toasty Software
  identity_name: ToastySoftware.TheBakersArchive
  publisher: CN=85C6607D-F08D-4FDB-ACC4-DAD6918EECFC
  msix_version: 1.0.0.0
  logo_path: web/icons/Icon-512.png
  capabilities: internetClient
  architecture: x64
