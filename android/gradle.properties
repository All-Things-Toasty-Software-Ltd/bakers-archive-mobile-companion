# The deployer is expected to run on a memory-constrained Debian LXC.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=1

kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m
kotlin.incremental=false

android.useAndroidX=true

# This newDsl flag was added by the Flutter template
android.newDsl=false

# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.nonTransitiveRClass=true
android.nonTransitiveAppRClass=true
